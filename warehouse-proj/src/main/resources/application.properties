spring.application.name=warehouse-proj

# Secrets live in .env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT. JWT_SECRET is a base64 string of at least 32 bytes (see .env.example).
app.jwt.secret=${JWT_SECRET}

# Fill an empty database with sample data on startup (only when there are no products yet).
app.seed.enabled=${SEED_DATA:true}

# Browser origins allowed to call /api/** (comma separated). Default: the Vite dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Origins allowed to open the notifications WebSocket (comma separated). Default: the Vite dev server.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.issuer=warehouse-proj
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
